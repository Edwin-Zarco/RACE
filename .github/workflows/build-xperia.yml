name: Build RACE (Android armeabi-v7a)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r23c
  APP_PLATFORM: android-16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Build
        working-directory: jni
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          "$NDK_HOME/ndk-build" -j"$(nproc)" \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=${{ env.APP_PLATFORM }} \
            APP_OPTIM=release \
            LOCAL_ARM_MODE=arm \
            APP_CFLAGS="-O3 -DNDEBUG -march=armv7-a -mtune=cortex-a8 -mfpu=neon -mfloat-abi=softfp -ffast-math -fomit-frame-pointer -funroll-loops -fno-stack-protector -ffunction-sections -fdata-sections -flto" \
            APP_LDFLAGS="-flto -Wl,--lto-O3 -Wl,--gc-sections -Wl,-O2"

      - name: Package
        run: |
          mkdir -p dist
          cp libs/armeabi-v7a/libretro.so dist/race_libretro_android.so

      - uses: actions/upload-artifact@v7
        with:
          name: race_libretro_android_armv7
          path: dist/race_libretro_android.so
